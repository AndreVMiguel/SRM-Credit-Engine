spring:
  application:
    name: srm-credit-engine
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/srm_credit}
    username: ${DB_USER:srm}
    password: ${DB_PASSWORD:srm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
